services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: https://tongxue.yongle.school/openvibe
    image: openvibe:${OPENVIBE_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3210:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/openvibe/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
