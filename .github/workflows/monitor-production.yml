name: Monitor production

on:
  workflow_dispatch:
  schedule:
    - cron: "23,53 * * * *"

permissions:
  contents: read

concurrency:
  group: openvibe-production-monitor
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout health checks
        uses: actions/checkout@v7

      - name: Check public routes
        run: bash scripts/ops/smoke-test.sh https://vibe.yongle.school

      - name: Check repeated public latency
        run: bash scripts/ops/latency-test.sh https://vibe.yongle.school
