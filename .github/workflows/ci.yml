name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate contracts and data
        run: npm test

      - name: Build web application
        env:
          NEXT_PUBLIC_SITE_URL: https://vibe.yongle.school
        run: npm run build

      - name: Validate production container definition
        run: docker compose -f compose.production.yml config --quiet
