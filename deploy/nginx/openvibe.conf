server {
    listen 80;
    listen [::]:80;
    server_name vibe.yongle.school;

    # 旧域名只作为迁移别名；OpenVibe 的正式地址是同学站内频道。
    return 308 https://tongxue.yongle.school/openvibe$request_uri;
}

